<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container{
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        form p{
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        label{
            margin-bottom: 5px;
            font-weight: bold;
        }

        input{
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #0056b3;
        }

        .errorlist{
            color: red;
            list-style: none;
            padding: 0;
            margin-top: 5px;
            font-size: 14px;
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>Event Registration</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Register
            </button>

        </form>

    </div>

</body>
</html>
